[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satisfactory-route-tool"
version = "0.2.0"
description = "Mode-aware Satisfactory route solver and SCIM visual-road preprocessor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "matplotlib>=3.8",
]

[project.scripts]
satisfactory-route = "satisfactory_route_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
