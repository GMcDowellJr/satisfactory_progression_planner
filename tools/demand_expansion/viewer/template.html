const P = JSON.parse(payloadEl.textContent);
const RES = new Set(P.resources);
const name = id => P.names[id] || id;
const FLUID = P.fluid_rounding_unit;
const ALT = Object.fromEntries(P.alternates.map(a => [a[0], {rid: a[0], name: a[1], item: a[2], unlock: a[3], reason: a[4]}]));
const state = { rm: '1', pm: '1', screen: 'phases', phase: 3, part: 'Desc_Motor_C', open: new Set(), seen: new Set(), more: false, alts: new Set(), altq: '' };
try { const s = JSON.parse(localStorage.getItem('pad-state') || '{}');
  if (P.recipe_multipliers.includes(s.rm)) state.rm = s.rm;
  if (P.pa_multipliers.includes(s.pm)) state.pm = s.pm;
  if (['phases', 'parts', 'alternates', 'about'].includes(s.screen)) state.screen = s.screen;
  if (P.deliveries.some(d => d[0] === s.phase)) state.phase = s.phase;
  if (P.names[s.part]) state.part = s.part;
  state.more = !!s.more;
  for (const rid of (s.alts || [])) if (ALT[rid] && !ALT[rid].reason) state.alts.add(rid);
} catch (e) {}
function remember() { try { localStorage.setItem('pad-state', JSON.stringify({rm: state.rm, pm: state.pm, screen: state.screen, phase: state.phase, part: state.part, more: state.more, alts: [...state.alts]})); } catch (e) {} }

// ---- the graph for the current alternates, the expansions for the current multipliers
const GRAPHS = new Map(), AGG = new Map(), COEF = new Map();
const altKey = () => [...state.alts].sort().join('+');
function routes() { return {...P.routes, alternates: [...state.alts].sort().map(rid => [ALT[rid].item, rid])}; }
function graph() { const k = altKey(); if (!GRAPHS.has(k)) GRAPHS.set(k, Engine.build(P, routes())); return GRAPHS.get(k); }
function agg() { const k = altKey() + '|' + state.rm + '|' + state.pm; if (!AGG.has(k)) AGG.set(k, Engine.aggregate(graph(), P.deliveries, +state.rm, +state.pm, FLUID)); return AGG.get(k); }
function coef() {
  const k = altKey() + '|' + state.rm;
  if (!COEF.has(k)) {
    const {rows, refused} = Engine.coefficients(graph(), +state.rm, FLUID), byTarget = new Map(), bySource = new Map();
    for (const [s, t, per, direct, depth, kind] of rows) {
      if (!byTarget.has(t)) byTarget.set(t, []); byTarget.get(t).push({s, per, direct, depth, kind});
      if (!bySource.has(s)) bySource.set(s, []); bySource.get(s).push({t, per, direct, depth, kind});
    }
    COEF.set(k, {byTarget, bySource, refused});
  }
  return COEF.get(k);
}
const phases = () => agg().phases;
const phaseName = ph => (P.deliveries.find(d => d[0] === ph) || [])[1] || '';
const phaseUnlock = ph => (P.deliveries.find(d => d[0] === ph) || [])[4] || '';
const configId = () => `${P.routes.name}${[...state.alts].sort().map(r => '+' + r).join('')}/recipe${state.rm}/pa${state.pm}/fluid-${FLUID || 'none'}`;
const isLeaf = id => graph().isLeaf(id);

// ---- formatting
const fmt = n => { if (n == null || n === '') return ''; const a = Math.abs(n); const d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : 3; return Number(n).toLocaleString(undefined, {maximumFractionDigits: d}); };
const growth = c => c.growth.kind === 'ratio' ? fmt(c.growth.ratio) + '×' : c.growth.kind === 'new' ? 'new' : '·';
const leafTag = id => RES.has(id) ? '<span class="leaf">resource</span>' : graph().leaves.has(id) ? '<span class="leaf co">coproduct-supplied</span>' : altTag(id);
const altTag = id => { const rid = (graph().producers.get(id) || [])[0]; return rid && P.recipes[rid].alt ? `<span class="leaf alt" title="${esc(P.recipes[rid].n)}">alt</span>` : ''; };
const lb = ok => ok ? '' : '<span class="lb" title="lower bound">+</span>';
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const refusalText = err => err.refusal === 'AmbiguousRoute' ? `${name(err.item)} has ${err.candidates.length} possible recipes and no declared choice` : err.refusal === 'UnproducibleItem' ? `no enabled recipe makes ${name(err.item)}` : err.refusal === 'CycleDetected' ? `recipe cycle at ${name(err.item)}` : String(err.message);

// ---- drill-down tree
const parentUnits = {};
function directInputs(item) { return (coef().byTarget.get(item) || []).filter(r => r.direct > 0).sort((a, b) => b.direct - a.direct || name(a.s).localeCompare(name(b.s))); }
function treeNode(item, units, key, depth) {
  const kids = isLeaf(item) ? [] : directInputs(item);
  const isOpen = state.open.has(key);
  const tw = kids.length ? (isOpen ? '▾' : '▸') : '';
  let html = `<li><div class="node">` +
    (kids.length
      ? `<button data-toggle="${esc(key)}" aria-expanded="${isOpen}"><span class="tw">${tw}</span><span>${esc(name(item))}</span></button>`
      : `<span><span class="tw"></span>${esc(name(item))}</span>`) +
    `<span class="qty">${fmt(units)}</span>` +
    (depth ? `<span class="per">${fmt(units / parentUnits[key])} per parent</span>` : '') +
    leafTag(item) + `</div>`;
  if (kids.length && isOpen) {
    html += '<ul>';
    for (const k of kids) { const ck = key + '/' + k.s; parentUnits[ck] = units; html += treeNode(k.s, units * k.direct, ck, depth + 1); }
    html += '</ul>';
  }
  return html + '</li>';
}
function openOnce(key) { if (!state.seen.has(key)) { state.seen.add(key); state.open.add(key); } }
const colsToggle = () => `<label class="cols-toggle"><input type="checkbox" id="morecols" ${state.more ? 'checked' : ''}> Show cumulative and remaining</label>`;

// ---- phases screen
function renderPhases() {
  const a = agg(), ph = state.phase, rows = a.deliveries.filter(r => r.ph === ph), complete = a.complete[ph];
  let html = `<div class="chips" role="group" aria-label="Phase">` + phases().map(p =>
    `<button class="chip" data-phase="${p}" aria-pressed="${p === ph}">Phase ${p} <small>${esc(phaseName(p))}</small>${a.complete[p] ? '' : ' <span class="incomplete" title="a delivery was refused">incomplete</span>'}</button>`).join('') + `</div>`;
  html += `<h2>Phase ${ph}, ${esc(phaseName(ph))} <span class="muted">· delivery unlocks ${esc(phaseUnlock(ph))}</span></h2>`;
  html += `<div class="grid">` + rows.map(r => `<div class="card"><div class="label">Delivered</div><div>${esc(name(r.item))}</div><div class="big">${fmt(r.q)}</div>` +
    (r.q !== r.q1x ? `<div class="muted">${fmt(r.q1x)} at 1×</div>` : '') +
    (r.refusal ? `<div class="refused"><span class="incomplete">not expanded</span> ${esc(refusalText(r.refusal))}</div>` : '') + `</div>`).join('') + `</div>`;
  if (!complete) html += `<p class="incomplete">Phase ${ph} is incomplete: a delivery above could not be expanded, so every total that includes this phase is a lower bound.</p>`;
  html += `<section><h2>Inside the deliveries</h2><p class="sub">Each delivered part, then the parts its recipe takes, scaled to this phase's quantity. Open a part to see what it is made of. Expansion stops at a resource, or at a part supplied as a byproduct of another line.</p><ul class="tree">`;
  for (const r of rows) { if (r.refusal) continue; const key = `${altKey()}|${state.rm}|${state.pm}|${ph}:${r.item}`; parentUnits[key] = r.q; openOnce(key); html += treeNode(r.item, r.q, key, 0); }
  html += `</ul></section>`;
  const items = [...a.cells.values()].map(cs => cs.find(c => c.ph === ph)).filter(c => c && c.q > 0).sort((x, y) => name(x.item).localeCompare(name(y.item)));
  html += `<section><h2>Everything phase ${ph} requires</h2><p class="sub">${items.length} parts and resources, in units. Growth is against the previous phase; cumulative includes earlier phases; remaining is later phases only.</p>${colsToggle()}<div class="tablewrap"><table class="${state.more ? 'show-more' : ''}"><thead><tr><th>Part</th><th>This phase</th><th>Growth</th><th class="col-more">Cumulative</th><th class="col-more">Remaining</th></tr></thead><tbody>` +
    items.map(cl => `<tr><td><button class="link" data-part="${esc(cl.item)}">${esc(name(cl.item))}</button> ${leafTag(cl.item)}</td><td>${fmt(cl.q)}${lb(cl.ok)}</td><td>${growth(cl)}</td><td class="col-more">${fmt(cl.cum)}${lb(cl.cumOk)}</td><td class="col-more">${fmt(cl.rem)}${lb(cl.remOk)}</td></tr>`).join('') +
    `</tbody></table></div></section>`;
  document.getElementById('phases').innerHTML = html;
}

// ---- parts screen
function renderParts() {
  const c = coef(), a = agg(), part = state.part, series = a.cells.get(part) || [];
  const all = [...new Set([...a.cells.keys(), ...c.bySource.keys(), ...c.byTarget.keys()])].sort((x, y) => name(x).localeCompare(name(y)));
  let html = `<div class="search"><label for="partq" class="label">Part</label><input type="text" id="partq" list="partlist" value="${esc(name(part))}" autocomplete="off"><datalist id="partlist">${all.map(x => `<option value="${esc(name(x))}">`).join('')}</datalist>${leafTag(part)}</div>`;
  if (series.length) {
    const lastCell = series[series.length - 1], first = series.find(s => s.q > 0), last = [...series].reverse().find(s => s.q > 0);
    html += `<div class="stats"><div class="card stat"><div class="label">Lifetime units</div><div class="v">${fmt(lastCell.cum)}${lb(lastCell.cumOk)}</div></div><div class="card stat"><div class="label">First required</div><div class="v">${first ? 'Phase ' + first.ph : '–'}</div></div><div class="card stat"><div class="label">Last required</div><div class="v">${last ? 'Phase ' + last.ph : '–'}</div></div></div>`;
    html += chart(series);
    html += `${colsToggle()}<div class="tablewrap"><table class="${state.more ? 'show-more' : ''}"><thead><tr><th>Phase</th><th>Units</th><th>Growth</th><th class="col-more">Cumulative</th><th class="col-more">Remaining</th></tr></thead><tbody>` +
      series.map(cl => `<tr><td>Phase ${cl.ph} <span class="muted">${esc(phaseName(cl.ph))}</span></td><td>${fmt(cl.q)}${lb(cl.ok)}</td><td>${growth(cl)}</td><td class="col-more">${fmt(cl.cum)}${lb(cl.cumOk)}</td><td class="col-more">${fmt(cl.rem)}${lb(cl.remOk)}</td></tr>`).join('') + `</tbody></table></div>`;
  } else html += `<p class="sub">No Project Assembly delivery requires ${esc(name(part))} under this configuration.</p>`;
  const dest = (c.bySource.get(part) || []).sort((x, y) => name(x.t).localeCompare(name(y.t)));
  html += `<section><h2>Where ${esc(name(part))} ends up</h2><p class="sub">Units of ${esc(name(part))} inside one unit of each part below, by every recipe path, at ${esc(state.rm)}× recipe cost. Direct means the part's own recipe takes it.</p>` +
    (dest.length ? `<div class="tablewrap"><table><thead><tr><th>Target</th><th>Per unit</th><th>Direct</th><th>Depth</th></tr></thead><tbody>` +
      dest.map(d => `<tr><td><button class="link" data-part="${esc(d.t)}">${esc(name(d.t))}</button></td><td>${fmt(d.per)}</td><td>${d.direct ? fmt(d.direct) : '<span class="muted">·</span>'}</td><td>${d.depth}</td></tr>`).join('') + `</tbody></table></div>` : `<p class="sub">Nothing consumes it.</p>`) + `</section>`;
  const made = isLeaf(part) ? [] : directInputs(part);
  if (made.length) html += `<section><h2>What one ${esc(name(part))} takes</h2><ul class="tree">` + (() => { const key = `${altKey()}|${state.rm}|p:` + part; parentUnits[key] = 1; openOnce(key); return treeNode(part, 1, key, 0); })() + `</ul></section>`;
  document.getElementById('parts').innerHTML = html;
}

function chart(series) {
  const W = 640, H = 220, L = 60, R = 12, T = 18, B = 34, n = series.length;
  const max = Math.max(1, ...series.map(s => s.q)), step = niceStep(max), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / n, bw = Math.min(24, slot * 0.6);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${compact(v)}</text>`;
  let bars = '', maxI = series.reduce((m, s, k) => s.q > series[m].q ? k : m, 0);
  series.forEach((s, k) => {
    const x = L + slot * k + (slot - bw) / 2, yv = y(s.q), h = Math.max(0, y(0) - yv), rr = Math.min(4, h);
    const path = h > 0 ? `M${x},${y(0)} v${-(h - rr)} a${rr},${rr} 0 0 1 ${rr},${-rr} h${bw - 2 * rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${h - rr} z` : '';
    bars += `<g class="bar" data-k="${k}"><rect x="${L + slot * k}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>` +
      (path ? `<path d="${path}" fill="var(--accent)"/>` : '') +
      (!s.ok && h > 0 ? `<path d="${path}" fill="url(#hatch)"/>` : '') +
      `<text x="${L + slot * k + slot / 2}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--ink-2)">Phase ${s.ph}</text>` +
      ((k === maxI || k === n - 1) && s.q > 0 ? `<text x="${L + slot * k + slot / 2}" y="${yv - 6}" text-anchor="middle" font-size="11" fill="var(--ink)">${fmt(s.q)}${s.ok ? '' : '+'}</text>` : '') + `</g>`;
  });
  return `<figure><figcaption>Units required per phase (incremental). A hatched bar is a lower bound: that phase has a delivery the engine could not expand.</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Units required per phase"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)" opacity="0.55"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-width="2"/></pattern></defs>${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>${bars}</svg></figure>`;
}
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p; return 10 * p; }
function compact(v) { return v >= 1e6 ? +(v / 1e6).toFixed(2) + 'M' : v >= 1000 ? +(v / 1000).toFixed(2) + 'K' : String(+v.toFixed(2)); }

// ---- alternates screen
function renderAlternates() {
  const q = state.altq.trim().toLowerCase();
  const list = P.alternates.map(a => ALT[a[0]]).filter(a => !q || a.name.toLowerCase().includes(q) || name(a.item).toLowerCase().includes(q) || a.unlock.toLowerCase().includes(q));
  const selected = [...state.alts].map(r => ALT[r]).sort((x, y) => x.name.localeCompare(y.name));
  let html = `<h2>Alternate recipes</h2><p class="sub">Tick an alternate to make it the only recipe for the part it makes, everywhere that part appears. One alternate per part; ticking a second one for the same part replaces the first. Alternates that cannot be declared on this route table say why. Nothing here is ranked: the engine reports, you choose.</p>`;
  html += `<div class="toolbar"><input type="text" id="altq" placeholder="Search by alternate, part or unlock" value="${esc(state.altq)}" autocomplete="off"><button class="btn" id="altclear" ${selected.length ? '' : 'disabled'}>Clear ${selected.length ? selected.length : ''}</button></div>`;
  if (selected.length) html += `<p class="sub">In effect: ${selected.map(a => esc(a.name)).join(', ')}.</p>`;
  html += `<ul class="alt-list">` + list.map(a => {
    const on = state.alts.has(a.rid), off = !!a.reason;
    return `<li class="alt-row ${on ? 'on' : ''} ${off ? 'off' : ''}"><input type="checkbox" id="alt-${esc(a.rid)}" data-alt="${esc(a.rid)}" ${on ? 'checked' : ''} ${off ? 'disabled' : ''}><label for="alt-${esc(a.rid)}"><div>${esc(a.name)}</div><div class="what">makes ${esc(name(a.item))}${a.unlock ? ' · ' + esc(a.unlock) : ''}</div>${off ? `<div class="why">${esc(a.reason)}</div>` : ''}</label></li>`;
  }).join('') + `</ul>`;
  document.getElementById('alternates').innerHTML = html;
}

// ---- about
function renderAbout() {
  const p = P.provenance, c = coef(), selected = [...state.alts].map(r => ALT[r]);
  document.getElementById('about').innerHTML = `
  <h2>What this page shows</h2>
  <p>Quantities, in units, that each Space Elevator phase requires: the delivered parts themselves, plus everything inside them by every recipe path. There is no time here, no machine counts and no rates. The page carries a port of the repository's demand-expansion engine and runs it for the multipliers and alternates you choose. The port is checked, not trusted: at every load the page recomputes the default configuration and compares it with the Python engine's results embedded here, and says so below.</p>
  <h2>The two multipliers</h2>
  <p>Recipe cost scales every recipe's inputs per cycle, rounded to the nearest whole part as the game does, so it compounds unevenly through a chain. The settings below 1× need a floor rule the record leaves open and are not offered. Elevator parts scales the delivery quantities, rounded the same way (50 becomes 13 at 0.25×). Fluids round in ${esc(FLUID)}, as observed in game on 2026-10-10.</p>
  <h2>Rules the numbers rest on</h2>
  <p>A recipe produces only the output the game lists first; everything else is a coproduct and is never expanded through. Resources are leaves. Alternates are off unless declared; this view declares ${selected.length ? selected.map(a => esc(a.name)).join(', ') : 'none'}. A part that no recipe makes first but some recipe makes as a byproduct is a leaf: the requirement is shown as <span class="leaf co">coproduct-supplied</span> and which line covers it is left to the planner. A delivered part counts as itself in its own phase. A delivery whose recipe path reaches a part with several possible recipes and no declared choice is not expanded; its own quantity still counts and its phase is marked incomplete.</p>
  <h2>Configuration in view</h2>
  <p><span class="mono">${esc(configId())}</span></p>
  <h2>Self-check</h2>
  <p id="checkabout"></p>
  <h2>Provenance</h2>
  <p>Game ${esc(p.game_version)} build ${esc(p.build_number)}, reference data <span class="mono">${esc(p.game_build_id)}</span>, docs sha256 <span class="mono">${esc(p.docs_sha256.slice(0, 16))}…</span>. Route table <span class="mono">${esc(p.route_table)}</span>, hash <span class="mono">${esc(p.route_table_sha256.slice(0, 16))}…</span>.${payloadEl.dataset.repoHead ? ' Repository <span class="mono">' + esc(payloadEl.dataset.repoHead.slice(0, 12)) + '</span>.' : ''}${payloadEl.dataset.generated ? ' Generated ' + esc(payloadEl.dataset.generated) + '.' : ''}</p>
  <h2>Parts not expanded in this view</h2>
  <div class="tablewrap"><table><thead><tr><th>Part</th><th style="text-align:left">Why</th></tr></thead><tbody>${c.refused.map(([t, err]) => `<tr><td>${esc(name(t))}</td><td style="text-align:left;white-space:normal">${esc(refusalText(err))}</td></tr>`).join('')}</tbody></table></div>`;
  document.getElementById('checkabout').textContent = CHECK.text;
}

// ---- self-check against the engine's record, once per load
const CHECK = (() => {
  try {
    const r = Engine.selfCheck(P);
    if (r.problems.length) return {ok: false, text: `${r.problems.length} difference(s) from the engine's record across ${r.checked} checks: ${r.problems.slice(0, 3).join('; ')}`};
    return {ok: true, text: `Passed: ${r.checked.toLocaleString()} coefficient rows and phase cells recomputed here match the engine's record for every recipe multiplier and two phase tables.`};
  } catch (e) { return {ok: false, text: `The page's engine failed on the default configuration: ${e.message}`}; }
})();
document.getElementById('check').innerHTML = CHECK.ok ? '' : `<div class="banner" role="alert"><strong>Figures on this page may be wrong.</strong> ${esc(CHECK.text)}</div>`;

// ---- wiring
function render() {
  document.getElementById('rm').innerHTML = P.recipe_multipliers.map(m => `<button data-rm="${m}" aria-pressed="${m === state.rm}">${m}×</button>`).join('');
  document.getElementById('pm').innerHTML = P.pa_multipliers.map(m => `<button data-pm="${m}" aria-pressed="${m === state.pm}">${m}×</button>`).join('');
  document.getElementById('rmsel').innerHTML = P.recipe_multipliers.map(m => `<option value="${m}" ${m === state.rm ? 'selected' : ''}>${m}×</option>`).join('');
  document.getElementById('pmsel').innerHTML = P.pa_multipliers.map(m => `<option value="${m}" ${m === state.pm ? 'selected' : ''}>${m}×</option>`).join('');
  const chip = document.getElementById('altchip'); chip.textContent = state.alts.size ? `${state.alts.size} in effect` : 'none'; chip.classList.toggle('on', state.alts.size > 0);
  for (const b of document.querySelectorAll('#screens button')) b.setAttribute('aria-pressed', String(b.dataset.screen === state.screen));
  for (const s of ['phases', 'parts', 'alternates', 'about']) document.getElementById(s).hidden = s !== state.screen;
  ({phases: renderPhases, parts: renderParts, alternates: renderAlternates, about: renderAbout})[state.screen]();
  document.getElementById('foot').textContent = `${configId()}. ${CHECK.ok ? 'Self-check passed.' : 'Self-check failed; see About.'} Every figure is exact in the engine; this page rounds for display.`;
  remember();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.rm) { state.rm = t.dataset.rm; render(); }
  else if (t.dataset.pm) { state.pm = t.dataset.pm; render(); }
  else if (t.dataset.screen) { state.screen = t.dataset.screen; render(); }
  else if (t.dataset.phase) { state.phase = +t.dataset.phase; render(); }
  else if (t.dataset.toggle) { const k = t.dataset.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); render(); }
  else if (t.dataset.part) { state.part = t.dataset.part; state.screen = 'parts'; render(); window.scrollTo({top: 0}); }
  else if (t.id === 'altclear') { state.alts.clear(); render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'rmsel') { state.rm = e.target.value; render(); return; }
  if (e.target.id === 'pmsel') { state.pm = e.target.value; render(); return; }
  if (e.target.id === 'morecols') { state.more = e.target.checked; render(); return; }
  if (e.target.dataset && e.target.dataset.alt) {
    const rid = e.target.dataset.alt, a = ALT[rid];
    if (e.target.checked) { for (const other of [...state.alts]) if (ALT[other].item === a.item) state.alts.delete(other); state.alts.add(rid); }
    else state.alts.delete(rid);
    render(); return;
  }
  if (e.target.id !== 'partq') return;
  const v = e.target.value.trim(); const hit = Object.entries(P.names).find(([id, n]) => n.toLowerCase() === v.toLowerCase());
  if (hit) { state.part = hit[0]; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'altq') { state.altq = e.target.value; renderAlternates(); const el = document.getElementById('altq'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const g = e.target.closest && e.target.closest('g.bar'); if (!g) { tip.style.display = 'none'; return; }
  const s = (agg().cells.get(state.part) || [])[+g.dataset.k]; if (!s) return;
  tip.textContent = `Phase ${s.ph}: ${fmt(s.q)} units${s.ok ? '' : ' (lower bound)'} · cumulative ${fmt(s.cum)} · remaining ${fmt(s.rem)}`;
  tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px';
});
render();
</script>
</body>
</html>
