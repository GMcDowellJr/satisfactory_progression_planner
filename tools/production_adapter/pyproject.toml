[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satisfactory-production-adapter"
version = "0.1.0"
description = "Narrow interface between the progression planner and whichever production solver sits underneath."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# The contract stays dependency-free: `import production_adapter` pulls in nothing
# beyond the standard library. Only `production_adapter.lp_backend` needs scipy,
# and `__init__.py` deliberately does not import it.
lp = ["scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
