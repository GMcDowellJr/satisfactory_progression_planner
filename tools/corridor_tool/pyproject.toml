[project]
name = "satisfactory-corridor-tool"
version = "0.1.0"
description = "Derive reusable terrain corridor/connectivity geometry from Satisfactory world rasters."
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2", "scipy>=1.13", "scikit-image>=0.24"]

[project.scripts]
satisfactory-corridors = "corridor_tool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
